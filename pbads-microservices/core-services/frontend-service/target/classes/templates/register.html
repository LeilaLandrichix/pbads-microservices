<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PBADS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">PBADS</div>
            <div class="nav-links">
                <a href="/dashboard">DASHBOARD</a>
                <a href="/data">DATA ENTRY</a>
                <a href="/alerts">ALERTS</a>
                <a href="/login">LOGIN</a>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="login-container">
            <div class="login-card">
                <h1>Create Account</h1>
                
                <div th:if="${success}" class="alert alert-success">
                    <span th:text="${success}">Success message</span>
                </div>
                
                <div th:if="${error}" class="alert alert-error">
                    <span th:text="${error}">Error message</span>
                </div>
                
                <form th:action="@{/register}" method="post" class="login-form">
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required autofocus minlength="3" maxlength="50">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName">
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">REGISTER</button>
                </form>
                
                <div style="margin-top: 20px; text-align: center;">
                    <p>Already have an account? <a href="/login" style="color: #3498db; text-decoration: underline;">Sign in here</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
