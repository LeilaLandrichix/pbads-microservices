<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Data Entry - PBADS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img th:src="@{/image/pbads_icon.png}" alt="PBADS Icon">
                PBADS
            </div>
            <div class="nav-links">
                <span class="user-greeting" th:if="${session.firstName != null}">
                    Hello, <strong th:text="${session.firstName}">User</strong>
                </span>
                <a href="/dashboard">DASHBOARD</a>
                <a href="/data" class="active">DATA ENTRY</a>
                <a href="/alerts">ALERTS</a>
                <a th:if="${session.isAdmin}" href="/users">USERS</a>
                <a href="/logout">LOGOUT</a>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="container">
            <h1>Daily Data Entry</h1>
            
            <div th:if="${success}" class="alert alert-success">
                <strong>✓</strong> <span th:text="${success}">Success message</span>
            </div>
            
            <div th:if="${error}" class="alert alert-error">
                <strong>✗</strong> <span th:text="${error}">Error message</span>
            </div>
            
            <div class="card">
                <form th:action="@{/data}" method="post" class="data-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date *</label>
                            <input type="date" id="date" name="date" th:value="${today}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="wakeUpTime">Wake Up Time</label>
                            <input type="time" id="wakeUpTime" name="wakeUpTime">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="sleepHours">Sleep Hours</label>
                            <input type="number" id="sleepHours" name="sleepHours" step="0.5" min="0">
                        </div>
                        
                        <div class="form-group">
                            <label for="steps">Steps</label>
                            <input type="number" id="steps" name="steps" min="0">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="caloriesBurned">Calories Burned</label>
                            <input type="number" id="caloriesBurned" name="caloriesBurned" min="0">
                        </div>
                        
                        <div class="form-group">
                            <label for="waterIntakeMl">Water Intake (ml)</label>
                            <input type="number" id="waterIntakeMl" name="waterIntakeMl" min="0">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="studyHours">Study Hours</label>
                            <input type="number" id="studyHours" name="studyHours" step="0.5" min="0">
                        </div>
                        
                        <div class="form-group">
                            <label for="moodScore">Mood Score (1-10)</label>
                            <input type="number" id="moodScore" name="moodScore" min="1" max="10">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Save Data</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
