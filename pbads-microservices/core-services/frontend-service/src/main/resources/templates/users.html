<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - PBADS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">PBADS</div>
            <div class="nav-links">
                <span class="user-greeting" th:if="${session.firstName != null}">
                    Hello, <strong th:text="${session.firstName}">User</strong>
                </span>
                <a href="/dashboard">DASHBOARD</a>
                <a href="/data">DATA ENTRY</a>
                <a href="/alerts">ALERTS</a>
                <a href="/users" class="active">USERS</a>
                <a href="/logout">LOGOUT</a>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="container">
            <h1>User Management</h1>
            
            <div th:if="${success}" class="alert alert-success">
                <strong>✓</strong> <span th:text="${success}">Success message</span>
            </div>
            
            <div th:if="${error}" class="alert alert-error">
                <strong>✗</strong> <span th:text="${error}">Error message</span>
            </div>
            
            <div th:if="${!hasUsers}" class="alert alert-info">
                <strong>ℹ</strong> No users found.
            </div>
            
            <div th:if="${hasUsers}" class="card">
                <h2>All Users</h2>
                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <thead>
                        <tr style="background: #f5f5f5; border-bottom: 2px solid #ddd;">
                            <th style="padding: 12px; text-align: left;">ID</th>
                            <th style="padding: 12px; text-align: left;">Username</th>
                            <th style="padding: 12px; text-align: left;">Email</th>
                            <th style="padding: 12px; text-align: left;">Name</th>
                            <th style="padding: 12px; text-align: left;">Role</th>
                            <th style="padding: 12px; text-align: left;">Status</th>
                            <th style="padding: 12px; text-align: left;">Created</th>
                            <th style="padding: 12px; text-align: left;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}" style="border-bottom: 1px solid #eee;">
                            <td style="padding: 12px;" th:text="${user.id}">1</td>
                            <td style="padding: 12px;" th:text="${user.username}">username</td>
                            <td style="padding: 12px;" th:text="${user.email}">email@example.com</td>
                            <td style="padding: 12px;">
                                <span th:text="${user.firstName != null ? user.firstName : ''}">First</span>
                                <span th:text="${user.lastName != null ? user.lastName : ''}">Last</span>
                            </td>
                            <td style="padding: 12px;">
                                <span th:if="${user.role == 'ADMIN'}" style="background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;" th:text="${user.role}">ADMIN</span>
                                <span th:if="${user.role != 'ADMIN'}" style="background: #3498db; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em;" th:text="${user.role}">USER</span>
                            </td>
                            <td style="padding: 12px;">
                                <span th:if="${user.enabled}" style="color: #27ae60; font-weight: bold;">✓ Active</span>
                                <span th:if="${!user.enabled}" style="color: #e74c3c; font-weight: bold;">✗ Disabled</span>
                            </td>
                            <td style="padding: 12px;">
                                <span th:if="${user.createdAt != null}" th:text="${#strings.substring(user.createdAt.toString(), 0, 10)}">2025-12-22</span>
                                <span th:if="${user.createdAt == null}">N/A</span>
                            </td>
                            <td style="padding: 12px;">
                                <form th:if="${user.username != 'admin'}" th:action="@{/users/{id}/toggle(id=${user.id})}" method="post" style="display: inline;">
                                    <input type="hidden" th:name="enabled" th:value="${!user.enabled}">
                                    <button type="submit" th:if="${user.enabled}" style="background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em;">Disable</button>
                                    <button type="submit" th:if="${!user.enabled}" style="background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em;">Enable</button>
                                </form>
                                <form th:if="${user.username != 'admin'}" th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="display: inline; margin-left: 8px;" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                    <button type="submit" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em;">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
