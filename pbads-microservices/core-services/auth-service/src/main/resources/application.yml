spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      uri: http://localhost:8888
      name: auth-service
      profile: default
  # Fallback database configuration if config server is not available
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_auth
    username: ${DB_USERNAME:pbads}
    password: ${DB_PASSWORD:pbads_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false

server:
  port: 8081
