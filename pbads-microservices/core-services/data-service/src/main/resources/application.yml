spring:
  application:
    name: data-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      uri: http://localhost:8888
      name: data-service
      profile: default
  # Fallback database configuration if config server is not available
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_data
    username: ${DB_USERNAME:pbads}
    password: ${DB_PASSWORD:pbads_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

# Kafka Topics
kafka:
  topics:
    data-logged: data.logged.events

# Direct Inference Service Call (fallback when Kafka is not available)
inference:
  service:
    url: http://localhost:8084
data:
  service:
    direct-inference: true  # Enable direct HTTP calls when Kafka fails