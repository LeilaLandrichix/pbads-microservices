spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_data
    username: ${DB_USERNAME:pbads}
    password: ${DB_PASSWORD:pbads_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false

