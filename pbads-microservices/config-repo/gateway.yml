server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service Routes
        # Using direct URL instead of lb:// for development (when Eureka is not available)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          # Rate limiter removed for development - uncomment if Redis is available
          # filters:
          #   - name: RequestRateLimiter
          #     args:
          #       redis-rate-limiter.replenishRate: 10
          #       redis-rate-limiter.burstCapacity: 20
          #       key-resolver: "#{@userKeyResolver}"
        
        # Data Service Routes
        # Using direct URL instead of lb:// for development (when Eureka is not available)
        - id: data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/data/**
          filters:
            - name: CircuitBreaker
              args:
                name: dataServiceCircuitBreaker
                fallbackUri: forward:/fallback/data
        
        # Model Service Routes
        - id: model-service
          uri: lb://model-service
          predicates:
            - Path=/api/model/**
          filters:
            - StripPrefix=1
        
        # Inference Service Routes
        - id: inference-service
          uri: lb://inference-service
          predicates:
            - Path=/api/inference/**
          filters:
            - StripPrefix=1
        
        # Alert Service Routes
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**
          # StripPrefix removed - controller expects /api/alerts path
        
        # Monitoring Service Routes
        - id: monitoring-service
          uri: lb://monitoring-service
          predicates:
            - Path=/api/monitoring/**
          filters:
            - StripPrefix=1
        
        # Recommendation Service Routes
        - id: recommendation-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/recommendations/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      dataServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

redis:
  host: localhost
  port: 6379
  timeout: 2000ms

