server:
  port: 8086

spring:
  application:
    name: monitoring-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_monitoring
    username: pbads
    password: pbads_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

prometheus:
  metrics:
    enabled: true
    path: /actuator/prometheus

grafana:
  dashboards:
    path: ./grafana/dashboards
    provisioning:
      path: ./grafana/provisioning

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.pbdas.monitoring: DEBUG

