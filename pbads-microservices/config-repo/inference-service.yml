server:
  port: 8084

spring:
  application:
    name: inference-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inference-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.pbdas.data.model.event.DataLoggedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    cache:
      model-cache-ttl: 3600 # 1 hour

inference:
  model:
    cache-ttl: 3600
    default-threshold: 0.75
    fallback-enabled: true
  thresholds:
    anomaly-score:
      low: 0.5
      medium: 0.75
      high: 0.9
  rule-based:
    enabled: true
    rules-file: classpath:rules/anomaly_rules.json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

feign:
  client:
    config:
      model-service:
        url: http://localhost:8083
      alert-service:
        url: http://localhost:8085

logging:
  level:
    com.pbdas.inference: DEBUG
    org.springframework.kafka: INFO

