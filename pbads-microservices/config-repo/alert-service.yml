server:
  port: 8085

spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_alert
    username: pbads
    password: pbads_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  websocket:
    allowed-origins: "*"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

alert:
  notification:
    channels: ["websocket", "email"]
    cooldown-period: 3600 # seconds between similar alerts
  recommendations:
    rules-file: classpath:recommendations/rules.json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.pbdas.alert: DEBUG
    org.springframework.kafka: INFO

