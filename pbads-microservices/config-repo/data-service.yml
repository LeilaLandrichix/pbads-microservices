server:
  port: 8082

spring:
  application:
    name: data-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_data
    username: pbads
    password: pbads_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: data-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.pbdas.data.model.event.DataLoggedEvent

kafka:
  topics:
    data-logged: data.logged.events
    anomaly-detected: anomaly.detected.events

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

feign:
  client:
    config:
      auth-service:
        url: http://localhost:8081
        connectTimeout: 5000
        readTimeout: 5000

logging:
  level:
    com.pbdas.data: DEBUG
    org.springframework.kafka: INFO

