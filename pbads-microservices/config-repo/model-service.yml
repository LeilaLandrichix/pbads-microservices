server:
  port: 8083

spring:
  application:
    name: model-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pbads_model
    username: pbads
    password: pbads_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mlflow:
  tracking-uri: http://localhost:5000
  artifact-store: ./models/artifacts
  experiment-name: pbads-anomaly-detection

model:
  storage:
    path: ./models/storage
    format: joblib
  training:
    default-algorithm: isolation-forest
    hyperparameters:
      isolation-forest:
        contamination: 0.1
        n-estimators: 100
      lstm:
        epochs: 50
        batch-size: 32
        units: 64

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

feign:
  client:
    config:
      data-service:
        url: http://localhost:8082
      inference-service:
        url: http://localhost:8084

logging:
  level:
    com.pbdas.model: DEBUG

